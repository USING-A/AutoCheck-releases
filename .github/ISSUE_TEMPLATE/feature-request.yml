name: 功能建议
description: 提出招聘平台、浏览器或使用流程方面的建议
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请描述使用场景。不要公开个人求职记录、账号、完整网址、Cookie 或验证码。Issue 可能公开可见。
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到的限制
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望实现的体验
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: 招聘网站域名（可选）
      placeholder: jobs.example.com
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我没有包含个人求职信息或认证信息。
          required: true
