name: 问题报告
description: 报告安装、数据、查询、识别或界面问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        Issue 可能公开可见。请移除姓名、账号、完整网址、Cookie、验证码、简历、原始扩展数据和未打码截图。需要说明网站时，只填域名。
  - type: input
    id: version
    attributes:
      label: AutoCheck 版本
      placeholder: 例如 1.2.9
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: 例如 Microsoft Edge 154
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: 招聘网站域名（可选）
      placeholder: jobs.example.com
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除个人信息、认证信息和未打码截图。
          required: true
